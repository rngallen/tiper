openapi: 3.0.3
info:
  title: TIPER Depot Fuel Management System API
  version: 1.0.0
  description: |
    Enterprise depot fuel management for **TIPER** (Tanzania International
    Petroleum Reserves Limited) at Kigamboni — stock ledger, vessel receipts
    via **SBM** (Single Buoy Mooring) and **KOJ** (Kurasini Oil Jetty), ITT,
    zerolisation, gantry loading, pump-over, FSF/VSF/TBS/KOJ billing, EWURA
    licenses, Sage AR posting, and approvals.

    **Company**
    Tanzania International Petroleum Reserves Limited · Dar es Salaam, Tanzania
    Website: https://tiper.co.tz

    **Authentication (PASETO, OTP-mandatory)**
    1. `POST /auth/login` with email and password — returns a short-lived
       **OTP token** and sends a verification code (email, plus SMS when the
       user has a phone number).
    2. `POST /auth/mfa/verify` with the code, sending the OTP token as the
       Bearer token — returns the access + refresh token pair.
    3. Send the access token on every request: `Authorization: Bearer <token>`.
    4. Refresh before expiry with `POST /auth/refresh` (send the **refresh**
       token as the Bearer token). Both tokens are rotated.

    **Response envelope** — every endpoint returns
    `{ "message": string?, "details": object|array? }`.

    **Permissions** follow `{module}.{action}` (e.g. `inventory.read`,
    `billing.run`, `reports.read`). A `{module}.manage` code grants full access
    to that module. Super-users bypass all checks.

    **Reports** — `GET /reports/{code}` returns JSON. Append `.pdf` or pass
    `export=true` / `format=xlsx` for a printable PDF or Excel workbook.
  contact:
    name: Tanzania International Petroleum Reserves Limited
    url: https://tiper.co.tz
    email: info@tiper.co.tz
  license:
    name: Proprietary
    url: https://tiper.co.tz

servers:
  - url: /api/v1
    description: Versioned REST API
  - url: /
    description: Root (health probes, raw spec)

tags:
  - name: System
    description: Health and readiness probes
  - name: Auth
    description: Login, OTP, tokens, profile and password
  - name: Users
    description: User administration (`users.read` / `users.manage`)
  - name: Roles & Permissions
    description: RBAC (`roles.read` / `roles.manage`)
  - name: Titles
    description: Job-title catalogue
  - name: Master data
    description: Products, tanks, vessels, customers, depots (`masterdata.*`)
  - name: Inventory
    description: Receipts, ITT, zerolisation, dips, book ledger (`inventory.*`)
  - name: Orders
    description: GLR, pump-over, trucks, compartmentalization (`orders.*`)
  - name: Billing
    description: Profiles, runs, variable/KOJ/TBS/MI-loss batches (`billing.*`)
  - name: EWURA
    description: Petroleum licenses synced from the regulator (`ewura.*`)
  - name: Workflow
    description: Approval processes, inbox and decisions
  - name: Sage
    description: Sage 200 connection status (posting lives in the billing engine)
  - name: Audit
    description: Append-only audit trail with field-level diffs
  - name: Reports
    description: Stock, reception, gantry, finance and access reports (JSON / Excel / PDF)
  - name: Settings
    description: Company profile, currencies, mail, SMS, Sage, session and schedules

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [System]
      security: []
      servers: [{ url: / }]
      summary: Liveness probe
      description: Process is up. Does not check databases.
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              example: { status: OK }
  /readyz:
    get:
      tags: [System]
      security: []
      servers: [{ url: / }]
      summary: Readiness probe (pings application and Sage databases)
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              example: { status: OK }
        "503":
          description: A dependency is unavailable

  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: Fetch CSRF token for cookie-based SPA calls
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              example: { details: { csrfToken: "…" } }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate with email + password (always issues an OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: ngallen4@gmail.com, password: "Admin@2026" }
      responses:
        "200":
          description: OTP challenge
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      details: { $ref: "#/components/schemas/LoginPending" }

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify the one-time code (send OTP token as Bearer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Session tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      details: { $ref: "#/components/schemas/TokenResponse" }

  /auth/mfa/resend:
    post:
      tags: [Auth]
      summary: Resend OTP (OTP Bearer required)
      responses:
        "200": { description: New challenge issued }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate access + refresh tokens (refresh token as Bearer)
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      details: { $ref: "#/components/schemas/TokenResponse" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      responses:
        "200": { description: Signed out }

  /auth/profile:
    get:
      tags: [Auth]
      summary: Current user, permissions and idle policy
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      details: { $ref: "#/components/schemas/MeResponse" }
    patch:
      tags: [Auth]
      summary: Update own name and profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                profile: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200": { description: Updated }

  /auth/profile/apperance-settings:
    patch:
      tags: [Auth]
      summary: Update UI appearance (theme, compact, sidebar)
      responses:
        "200": { description: Updated }

  /auth/profile/table-prefs:
    put:
      tags: [Auth]
      summary: Save per-table column order / visibility
      responses:
        "200": { description: Saved }

  /auth/profile/dashboard:
    put:
      tags: [Auth]
      summary: Save the signed-in user's chart dashboard (max 16 widgets)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardPayload" }
      responses:
        "200": { description: Saved }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password (invalidates other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword, confirmPassword]
              properties:
                oldPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
                confirmPassword: { type: string, format: password }
      responses:
        "200": { description: Password changed }

  /auth/users:
    get:
      tags: [Users]
      summary: List users
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/Search" }]
      responses:
        "200": { description: Paginated users }
    post:
      tags: [Users]
      summary: Create a user (temporary password emailed / SMS)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "200": { description: Created }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/users/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    patch:
      tags: [Users]
      summary: Update a user
      responses:
        "200": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      summary: Delete a user who has never signed in
      responses:
        "200": { description: Deleted }

  /auth/users/{uid}/unlock:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Users]
      summary: Unlock a locked account
      responses:
        "200": { description: Unlocked }

  /auth/users/{uid}/reset-password:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Users]
      summary: Reset password and email a temporary one
      responses:
        "200": { description: Reset }

  /auth/users/{uid}/roles:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    put:
      tags: [Users]
      summary: Replace assigned roles
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleIds: { type: array, items: { type: integer } }
      responses:
        "200": { description: Updated }

  /auth/users/search:
    get:
      tags: [Users]
      summary: Typeahead user search
      parameters: [{ $ref: "#/components/parameters/Search" }]
      responses:
        "200": { description: Matching users }

  /auth/roles:
    get:
      tags: [Roles & Permissions]
      summary: List roles
      responses:
        "200": { description: Roles }
    post:
      tags: [Roles & Permissions]
      summary: Create a role
      responses:
        "200": { description: Created }

  /auth/roles/options:
    get:
      tags: [Roles & Permissions]
      summary: Compact role list for pickers
      responses:
        "200": { description: Options }

  /auth/roles/{id}:
    parameters: [{ $ref: "#/components/parameters/IntId" }]
    get:
      tags: [Roles & Permissions]
      summary: Get a role
      responses:
        "200": { description: Role }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Roles & Permissions]
      summary: Update a role
      responses:
        "200": { description: Updated }
    delete:
      tags: [Roles & Permissions]
      summary: Delete an unused role
      responses:
        "200": { description: Deleted }

  /auth/roles/{id}/permissions:
    parameters: [{ $ref: "#/components/parameters/IntId" }]
    put:
      tags: [Roles & Permissions]
      summary: Replace role permissions
      responses:
        "200": { description: Updated }

  /auth/permissions:
    get:
      tags: [Roles & Permissions]
      summary: List permission catalogue
      responses:
        "200": { description: Permissions }

  /auth/titles:
    get:
      tags: [Titles]
      summary: List job titles
      responses:
        "200": { description: Titles }
    post:
      tags: [Titles]
      summary: Create a job title
      responses:
        "200": { description: Created }

  /auth/titles/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    patch:
      tags: [Titles]
      summary: Update a job title
      responses:
        "200": { description: Updated }
    delete:
      tags: [Titles]
      summary: Delete a job title
      responses:
        "200": { description: Deleted }

  /master/lookups:
    get:
      tags: [Master data]
      summary: Combined catalogues for forms (products, statuses, routes, tenders)
      responses:
        "200": { description: Lookups }

  /master/categories:
    get:
      tags: [Master data]
      summary: List stock categories
      responses:
        "200": { description: Categories }
    post:
      tags: [Master data]
      summary: Create a stock category
      responses:
        "200": { description: Created }

  /master/products:
    get:
      tags: [Master data]
      summary: List products (AGO, PMS, HFO, DPK, …)
      responses:
        "200": { description: Products }
    post:
      tags: [Master data]
      summary: Create a product
      responses:
        "200": { description: Created }

  /master/statuses:
    get:
      tags: [Master data]
      summary: List stock statuses (Local, Transit, Mines, Proration)
      responses:
        "200": { description: Statuses }
    post:
      tags: [Master data]
      summary: Create a stock status
      responses:
        "200": { description: Created }

  /master/uoms:
    get:
      tags: [Master data]
      summary: List units of measure
      responses:
        "200": { description: UOMs }

  /master/tanks:
    get:
      tags: [Master data]
      summary: List shore tanks
      responses:
        "200": { description: Tanks }
    post:
      tags: [Master data]
      summary: Create a tank
      responses:
        "200": { description: Created }

  /master/vessels:
    get:
      tags: [Master data]
      summary: List vessels
      responses:
        "200": { description: Vessels }
    post:
      tags: [Master data]
      summary: Create a vessel
      responses:
        "200": { description: Created }

  /master/depots:
    get:
      tags: [Master data]
      summary: List TIPER and pump-over destination depots
      responses:
        "200": { description: Depots }
    post:
      tags: [Master data]
      summary: Create a depot
      responses:
        "200": { description: Created }

  /master/customers:
    get:
      tags: [Master data]
      summary: List OMC customers
      responses:
        "200": { description: Customers }
    post:
      tags: [Master data]
      summary: Create a customer
      responses:
        "200": { description: Created }

  /master/customers/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Master data]
      summary: Get a customer
      responses:
        "200": { description: Customer }
        "404": { $ref: "#/components/responses/NotFound" }

  /master/customers/{uid}/billing-accounts:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Master data]
      summary: List Sage AR accounts mapped to this customer per fee and currency
      responses:
        "200": { description: Billing accounts }
    post:
      tags: [Master data]
      summary: Map a Sage Client account to a fee (currency comes from Sage iCurrencyID)
      responses:
        "201": { description: Created }
        "409": { description: Sage account already owned by another party }

  /master/customers/{uid}/attachments:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Master data]
      summary: List registration documents on this customer
      responses:
        "200": { description: Attachments }
    post:
      tags: [Master data]
      summary: Upload customer documents copied onto new ILR, pump-over, and ITT
      responses:
        "201": { description: Created }

  /master/suppliers:
    get:
      tags: [Master data]
      summary: List suppliers
      responses:
        "200": { description: Suppliers }
    post:
      tags: [Master data]
      summary: Create a supplier
      responses:
        "200": { description: Created }

  /master/suppliers/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Master data]
      summary: Get a supplier including billing accounts
      responses:
        "200": { description: Supplier }
        "404": { $ref: "#/components/responses/NotFound" }

  /master/suppliers/{uid}/billing-accounts:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Master data]
