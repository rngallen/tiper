      responses:
        "200": { description: Balances }

  /ic/reservations:
    get:
      tags: [Inventory]
      summary: List stock reservations
      responses:
        "200": { description: Reservations }
    post:
      tags: [Inventory]
      summary: Reserve stock for an order
      responses:
        "200": { description: Reserved }

  /ic/reservations/{order}/release:
