  /orders/compartmentalizations/{uid}/submit:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Orders]
      summary: Submit a compartmentalization
      responses:
        "200": { description: Submitted }

  /orders/amendments:
    get:
      tags: [Orders]
