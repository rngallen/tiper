components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO
      description: >
        PASETO v2.local token. Use the access token for normal calls, the OTP
        token for `/auth/mfa/verify`, and the refresh token for `/auth/refresh`.

  parameters:
    Uid:
      name: uid
      in: path
      required: true
      schema: { type: string, example: 01J0ABCDXYZ0000000000000 }
      description: Public ULID
    IntId:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 2 }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 10, maximum: 100 }
    Search:
      name: search
      in: query
      schema: { type: string }
    From:
      name: from
      in: query
      schema: { type: string, example: "2026-08-01" }
      description: Inclusive start (YYYY-MM-DD)
    To:
      name: to
      in: query
      schema: { type: string, example: "2026-08-31" }
      description: Inclusive end (YYYY-MM-DD)
    ReportCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        example: periodic-stock-status
      description: >
        Report code from GET /reports/registry. Stock and reception include
        periodic-stock-status, gain-loss, ewura-weekly, pbpa-weekly,
        customer-stock, daily-mass-balance, monthly-confirmation, itt-summary,
        srt-vessels, sbm-receipts, koj-receipts, pump-over-status. Finance
        includes billing-list, billing-by-trade, billing-by-product.

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { message: resource not found }
    ValidationError:
      description: Validation failed (422)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example:
            message: Invalid input
            details:
              - { field: email, error: Must be a valid email address }

  schemas:
    Envelope:
      type: object
      description: Standard response wrapper used by every endpoint.
      properties:
        message: { type: string, example: Updated successfully }
        details:
          description: Payload — object, array or omitted
          nullable: true

    Pagination:
      type: object
      properties:
        items: { type: array, items: {} }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalPages: { type: integer, example: 5 }
        itemsCount: { type: integer, format: int64, example: 96 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: ngallen4@gmail.com }
        password: { type: string, format: password }

    LoginPending:
      type: object
      properties:
        message: { type: string }
        token: { type: string, description: OTP-scoped Bearer for /auth/mfa/verify }
        issuedAt: { type: string, format: date-time }
        expiredAt: { type: string, format: date-time }

    TokenResponse:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        token: { type: string }
        tokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
        mustChangePassword: { type: boolean }

    ProfileInput:
      type: object
      properties:
        phoneNumber: { type: string, example: "255711223344" }
        title: { type: string, example: Stock Accountant }

    Profile:
      type: object
      properties:
        phoneNumber: { type: string }
        title: { type: string }
        appearanceSettings:
          type: object
          nullable: true

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        isActive: { type: boolean }
        isLocked: { type: boolean }
        mustChangePassword: { type: boolean }
        twoFactorEnabled: { type: boolean }
        lastLogin: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        profile: { $ref: "#/components/schemas/Profile" }

    UserCreateRequest:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        profile: { $ref: "#/components/schemas/ProfileInput" }

    MeResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: array
          items: { type: string }
          example: [inventory.read, reports.read, workflow.tasks]
        isSuperUser: { type: boolean }
        sessionIdleMinutes: { type: integer, example: 10 }
        sessionIdleWarnSeconds: { type: integer, example: 120 }

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Stock Accountant }
        description: { type: string }
        permissionCount: { type: integer }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    Permission:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: inventory.read }
        description: { type: string }
        module: { type: string, example: inventory }

    DashboardPayload:
      type: object
      properties:
        widgets:
          type: array
          maxItems: 16
          items:
            type: object
            required: [id, type, title, source]
            properties:
              id: { type: string }
              type: { type: string, enum: [kpi, bar, line, doughnut, table] }
              title: { type: string }
              source: { type: string, example: stock-by-product }
              span: { type: integer, enum: [1, 2] }

    ReportMeta:
      type: object
      properties:
        code: { type: string, example: periodic-stock-status }
        name: { type: string }
        group: { type: string, example: Stock }
        description: { type: string }
        filters:
          type: array
          items: { type: string }

    Country:
      type: object
      properties:
        code: { type: string, example: TZ }
        name: { type: string }
        alpha3: { type: string, example: TZA }
        numeric: { type: string, example: "834" }
        isActive: { type: boolean }
