        "200": { description: Created }

  /ic/itt/{uid}/submit:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Inventory]
      summary: Submit an ITT into workflow
      responses:
        "200": { description: Submitted }

  /ic/zerolization:
    get:
      tags: [Inventory]
      summary: List zerolisation transfers
      responses:
        "200": { description: Transfers }
    post:
      tags: [Inventory]
      summary: Create a zerolisation
      responses:
        "200": { description: Created }

  /ic/zerolization/{uid}/submit:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Inventory]
      summary: Submit a zerolisation into workflow
      responses:
        "200": { description: Submitted }

  /ic/dips:
    get:
      tags: [Inventory]
      summary: List physical tank dips
      responses:
        "200": { description: Dips }
    post:
      tags: [Inventory]
      summary: Record a physical dip
      responses:
        "200": { description: Created }

  /ic/line-content:
    post:
      tags: [Inventory]
      summary: Record daily pipeline line content
      responses:
        "200": { description: Created }

  /ic/events:
    get:
      tags: [Inventory]
      summary: List inbound gantry / pump-over events
      responses:
        "200": { description: Events }
    post:
      tags: [Inventory]
      summary: Ingest an inventory event
      responses:
        "200": { description: Created }

  /ic/movements:
    get:
      tags: [Inventory]
      summary: List book ledger movements
      parameters: [{ $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" }]
      responses:
        "200": { description: Movements }

  /orders/loading:
    get:
      tags: [Orders]
      summary: List gantry loading requests
      responses:
        "200": { description: GLRs }
    post:
      tags: [Orders]
      summary: Create a GLR
      responses:
        "200": { description: Created }

  /orders/loading/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Orders]
      summary: Get a GLR
      responses:
        "200": { description: GLR }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/loading/{uid}/submit:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Orders]
      summary: Submit a GLR into workflow
      responses:
        "200": { description: Submitted }

  /orders/loading-lines:
    get:
