      summary: List gantry loading lines (trucks)
      responses:
        "200": { description: Lines }

  /orders/loading-lines/{uid}/complete:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Orders]
      summary: Mark a loading line complete
      responses:
        "200": { description: Completed }

  /orders/pump-over:
    get:
      tags: [Orders]
      summary: List pump-over requests (pipeline delivery orders)
      responses:
        "200": { description: Requests }
    post:
      tags: [Orders]
      summary: Create a pump-over request
      responses:
        "200": { description: Created }

  /orders/pump-over/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Orders]
      summary: Get a pump-over request
      responses:
        "200": { description: Request }

  /orders/pump-over/{uid}/submit:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Orders]
      summary: Submit a pump-over request
      responses:
        "200": { description: Submitted }

  /orders/pump-over-reports:
    get:
      tags: [Orders]
      summary: List executed pump-over reports
      responses:
        "200": { description: Reports }
    post:
      tags: [Orders]
      summary: Create a pump-over report
      responses:
        "200": { description: Created }

  /orders/pump-over-reports/{uid}/submit:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Orders]
      summary: Submit a pump-over report
      responses:
        "200": { description: Submitted }

  /orders/compartmentalizations:
    get:
      tags: [Orders]
      summary: List compartmentalizations (ALMA SAP3C)
      responses:
        "200": { description: Records }
    post:
      tags: [Orders]
      summary: Create a compartmentalization from an open ILO
      description: |
        Builds tank cells from the truck calibration. Status is `running`.
        Body: `{ iloId, badgeId?, confirmExpiry? }`.
        409 with `details.code=nearExpiry` when the ILO expires within 3 days
        (retry with confirmExpiry=true). 422 for expired ILO, expired driver
        licence, or missing/expired calibration.
      responses:
        "201": { description: Created }
        "409": { description: Near-expiry confirmation required }
        "422": { description: Gate check failed }

  /orders/compartmentalizations/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Orders]
      summary: Get a compartmentalization
      responses:
        "200": { description: Record }

  /orders/compartmentalizations/{uid}/lines:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    post:
      tags: [Orders]
      summary: Save compartment lines (product, litres, seals)
      description: Seals are uppercased. Top/dip/bottom must differ and must not repeat elsewhere.
