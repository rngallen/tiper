      tags: [Inventory]
      summary: List vessel receipts (SBM / KOJ)
      parameters: [{ $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" }]
      responses:
        "200": { description: Receipts }
    post:
      tags: [Inventory]
      summary: Create a vessel receipt
      responses:
        "200": { description: Created }

  /ic/receipts/{uid}:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Inventory]
      summary: Get a receipt with parcels
      responses:
