        "409": { description: Sage account already owned by another party }

  /master/suppliers/{uid}/attachments:
    parameters: [{ $ref: "#/components/parameters/Uid" }]
    get:
      tags: [Master data]
      summary: List registration documents on this supplier
      responses:
        "200": { description: Attachments }
    post:
      tags: [Master data]
      summary: Upload supplier documents (TIN certificate, contract, registration)
      responses:
        "201": { description: Created }

  /ic/balances:
